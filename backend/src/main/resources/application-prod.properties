# Production profile. The app refuses to start without an explicit allow-list of
# browser origins (CORS_ALLOWED_ORIGINS) — there must never be a wildcard or a
# silently-open default. Set, for example:
#   CORS_ALLOWED_ORIGINS=https://gnosia.example.com,https://gnosia.example.net
# For a single-origin deployment (frontend served through the same host) list the
# public origin the browser connects to.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Production observability — health endpoint only; details stay hidden.
management.endpoint.health.show-details=never