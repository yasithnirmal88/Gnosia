# Local development profile. Explicit, fixed browser origins only — the Vite dev
# server (5173) and the backend itself (8080, used by tests, SockJS info, audio).
# Override with CORS_ALLOWED_ORIGINS when dev runs on other ports/hosts.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

# No production security headers in dev (CSP would break the Vite HMR pipeline).
server.forward-headers-strategy=none