server.port=${PORT:8080}
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.mvc.pathmatch.use-suffix-pattern=true
spring.web.resources.add-mappings=true

# Logging — override via LOG_LEVEL env var (e.g. DEBUG for troubleshooting)
logging.level.com.gonosia.game=${LOG_LEVEL:INFO}
logging.level.org.springframework.web.socket=${WS_LOG_LEVEL:WARN}

# CORS allowed origins — comma-separated, override via CORS_ALLOWED_ORIGINS env var
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com}

# Application-level abuse protection. Each category limits events over a fixed
# window (window-ms). Limits are coarse flood guards; gameplay rules (one vote per
# phase, one scan per warp, message length, etc.) are enforced separately.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.chat.limit=15
app.rate-limit.chat.window-ms=1000
app.rate-limit.dm.limit=15
app.rate-limit.dm.window-ms=1000
app.rate-limit.gnosia-chat.limit=15
app.rate-limit.gnosia-chat.window-ms=1000
app.rate-limit.signal.limit=30
app.rate-limit.signal.window-ms=1000
app.rate-limit.game-action.limit=20
app.rate-limit.game-action.window-ms=1000
app.rate-limit.join.limit=20
app.rate-limit.join.window-ms=10000
app.rate-limit.room-creation.limit=5
app.rate-limit.room-creation.window-ms=60000
app.rate-limit.message-flood.limit=200
app.rate-limit.message-flood.window-ms=1000

# Room lifecycle & retention. The cleanup sweep retires rooms that are finished
# (GAME_OVER retention), empty (never filled), or abandoned (every player gone for
# the reconnect-grace window). All retention values are seconds; 0 removes
# immediately once the condition holds. max-voting-history bounds the per-room
# voting-round buffer that is shipped to clients (memory + payload bound).
app.room-lifecycle.completed-retention-seconds=${ROOM_COMPLETED_RETENTION_SECONDS:300}
app.room-lifecycle.abandoned-retention-seconds=${ROOM_ABANDONED_RETENTION_SECONDS:600}
app.room-lifecycle.empty-retention-seconds=${ROOM_EMPTY_RETENTION_SECONDS:300}
app.room-lifecycle.sweep-interval-ms=${ROOM_SWEEP_INTERVAL_MS:30000}
app.room-lifecycle.max-voting-history=${ROOM_MAX_VOTING_HISTORY:100}
