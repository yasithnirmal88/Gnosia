server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sticky SPA fallback (no refresh 404s on client routes).
    location / {
        try_files $uri /index.html;
    }

    # Backend passthrough so the client stays on the same origin. In a compose
    # stack set the service name here ("backend:8080"). Deployments that set
    # VITE_BACKEND_URL at build time can disable this block instead.
    location /game-ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    location /game-ws-raw/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    location /audio/ {
        proxy_pass http://backend:8080;
    }
}