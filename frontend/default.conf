server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Production security headers. CSP allows the inline styles the UI relies on,
    # the Google Fonts stylesheet/fonts, and — for two-origin deployments where the
    # client talks to a separate backend host — https/wss WebSocket + SockJS
    # transports. frame-ancestors 'self' is the modern X-Frame-Options equivalent.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), gamepad=(self)" always;

    # Sticky SPA fallback (no refresh 404s on client routes).
    location / {
        try_files $uri /index.html;
    }

    # Real health liveness: proxies to the backend actuator endpoint so a DOWN
    # backend is not masked by the SPA fallback returning the HTML shell.
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
    }

    # Backend passthrough so the client stays on the same origin. In a compose
    # stack set the service name here ("backend:8080"). Deployments that set
    # VITE_BACKEND_URL at build time can disable this block instead.
    location /game-ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    location /game-ws-raw/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    location /audio/ {
        proxy_pass http://backend:8080;
    }
}