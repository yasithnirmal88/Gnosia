name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 0: secrets & credentials ──────────────────────────────────────────
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (committed secrets / credentials)
        uses: docker://zricethezav/gitleaks:v8.18.4
        with:
          args: git --no-git-value --redact --verbose

      - name: No .env files (except the committed example) may be tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env files are not allowed: $tracked"
            exit 1
          fi

      - name: No log/credential artifacts may be tracked
        run: |
          logs="$(git ls-files | grep -E '\.(log|err|out|credentials|pem|key)$' || true)"
          if [ -n "$logs" ]; then
            echo "::error::Log/credential artifacts must be gitignored, not committed: $logs"
            exit 1
          fi

  # ── Gate: backend — compile, unit+integration tests, dep scan, package ────
  backend:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-backend-${{ hashFiles('backend/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-backend-

      - name: Maven compile
        run: >-
          docker run --rm -v ~/.m2:/root/.m2 -w /workspace
          -v ${{ github.workspace }}:/workspace
          maven:3.9-eclipse-temurin-17-alpine
          mvn -B -ntp -f backend/pom.xml compile

      - name: Unit + integration tests
        run: >-
          docker run --rm -v ~/.m2:/root/.m2 -w /workspace
          -v ${{ github.workspace }}:/workspace
          maven:3.9-eclipse-temurin-17-alpine
          mvn -B -ntp -f backend/pom.xml test

      - name: Dependency vulnerability scan (OWASP, fails on CVSS >= 9)
        run: >-
          docker run --rm -v ~/.m2:/root/.m2 -w /workspace
          -v ${{ github.workspace }}:/workspace
          maven:3.9-eclipse-temurin-17-alpine
          mvn -B -ntp -f backend/pom.xml -DskipTests dependency-check:check

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore

      - name: Package build (jar)
        run: >-
          docker run --rm -v ~/.m2:/root/.m2 -w /workspace
          -v ${{ github.workspace }}:/workspace
          maven:3.9-eclipse-temurin-17-alpine
          mvn -B -ntp -f backend/pom.xml -DskipTests package

      - name: Verify backend Docker image builds
        run: docker build -t gnosia-backend:ci ./backend

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/game-*.jar

  # ── Gate: frontend — lint, typecheck, tests, audit, prod build ────────────
  frontend:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Tests
        run: npx vitest run
        working-directory: frontend

      - name: Dependency audit — production vulnerabilities (fails on critical)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

      - name: Dependency audit — full report (dev tooling visibility)
        run: npm audit --json > /tmp/npm-audit.json || true
        working-directory: frontend

      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: /tmp/npm-audit.json

      - name: Production build
        run: npm run build
        working-directory: frontend

      - name: No development URLs in the production bundle
        run: npm run check:prod-urls
        working-directory: frontend

      - name: Verify frontend Docker image builds
        run: docker build -t gnosia-frontend:ci ./frontend

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Gate: end-to-end (real backend + real browser) ────────────────────────
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Maven (backend harness)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-e2e-${{ runner.os }}-backend-${{ hashFiles('backend/pom.xml') }}

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/